<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start free trial - Frame to Form</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a09; --panel: #151412; --panel-2: #0f0e0c; --line: #2b2721;
      --gold: #c9a876; --gold-hi: #e2c493; --cream: #ece5d8;
      --text: #cfc8ba; --muted: #8f877a; --red: #e0604c;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      justify-content: center; align-items: center; padding: 20px;
    }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 34px; }
    .brand svg { height: 30px; width: auto; display: block; }
    .brand .word {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--gold); font-size: 16px; font-weight: 600;
      letter-spacing: 4px; text-transform: uppercase;
    }
    .signup-container {
      background: var(--panel); padding: 40px; border-radius: 6px;
      border: 1px solid var(--line); width: 100%; max-width: 400px;
    }
    h1 {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      color: var(--cream); margin-bottom: 8px;
      font-size: 30px; font-weight: 500;
      letter-spacing: 3px; text-transform: uppercase;
    }
    .subtext { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
    .trial-note {
      font-family: 'IBM Plex Mono', monospace;
      background: rgba(201, 168, 118, 0.08);
      border: 1px solid var(--gold);
      padding: 12px; border-radius: 4px; margin-bottom: 24px;
      font-size: 12px; color: var(--gold); letter-spacing: 1px;
    }
    .form-group { margin-bottom: 20px; }
    label {
      display: block; margin-bottom: 8px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--muted); font-size: 11px;
      letter-spacing: 2px; text-transform: uppercase;
    }
    input {
      width: 100%; padding: 12px;
      background: var(--panel-2); border: 1px solid var(--line);
      border-radius: 4px; color: var(--cream); font-size: 14px;
    }
    input:focus { outline: none; border-color: var(--gold); }
    .error { color: var(--red); font-size: 12px; margin-top: 5px; font-family: 'IBM Plex Mono', monospace; }
    button {
      width: 100%; padding: 13px;
      font-family: 'IBM Plex Mono', monospace;
      background: var(--gold); color: #12100d;
      border: none; border-radius: 4px;
      font-weight: 600; cursor: pointer; font-size: 13px;
      letter-spacing: 2px; text-transform: uppercase;
    }
    button:hover { background: var(--gold-hi); }
    .links { text-align: center; margin-top: 22px; font-size: 13px; color: var(--muted); }
    .links a { color: var(--gold); text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 104 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M4 48 L22 42 M22 42 L98 42 M22 42 L22 4" stroke="#c9a876" stroke-width="1" stroke-dasharray="2 3"/>
      <path d="M4 26 L4 10 L18 10 M66 10 L80 10 L80 26 M80 32 L80 48 L66 48 M18 48 L4 48 L4 32" stroke="#ece5d8" stroke-width="2.4"/>
      <path d="M4 10 L22 4 L98 4 L98 42 L80 48 M80 10 L98 4" stroke="#c9a876" stroke-width="1.8"/>
      <circle cx="80" cy="10" r="3.4" fill="#d94f3d"/>
    </svg>
    <span class="word">Frame &rarr; Form</span>
  </div>
  <div class="signup-container">
    <h1>Start free trial</h1>
    <p class="subtext">Create your Frame to Form account</p>

    <div class="trial-note">
      14 days free &middot; full pipeline access
    </div>

    <form id="signupForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <div class="error" id="emailError"></div>
      </div>
      <div class="form-group">
        <label for="password">Password (min 8 characters)</label>
        <input type="password" id="password" required minlength="8">
        <div class="error" id="passwordError"></div>
      </div>
      <button type="submit">Create account</button>
    </form>
    <div class="links">
      Already have an account? <a href="/login">Sign in</a>
    </div>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      document.getElementById('emailError').textContent = '';
      document.getElementById('passwordError').textContent = '';

      try {
        const res = await fetch('/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.redirect) window.location.href = data.redirect;
        else document.getElementById('emailError').textContent = data.error;
      } catch (err) {
        document.getElementById('emailError').textContent = 'Error creating account';
      }
    });
  </script>
</body>
</html>
