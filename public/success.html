<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscription active - Frame to Form</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a09; --panel: #151412; --line: #2b2721;
      --gold: #c9a876; --gold-hi: #e2c493; --cream: #ece5d8;
      --text: #cfc8ba; --muted: #8f877a; --green: #5ad178;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      min-height: 100vh; padding: 20px;
    }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 34px; }
    .brand svg { height: 30px; width: auto; display: block; }
    .brand .word {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--gold); font-size: 16px; font-weight: 600;
      letter-spacing: 4px; text-transform: uppercase;
    }
    .success-container {
      background: var(--panel); padding: 46px 40px; border-radius: 6px;
      border: 1px solid var(--line); width: 100%; max-width: 440px; text-align: center;
    }
    .tick {
      width: 54px; height: 54px; border-radius: 50%;
      border: 2px solid var(--green);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      color: var(--green); font-size: 26px;
    }
    h1 {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      color: var(--cream); margin-bottom: 12px;
      font-size: 28px; font-weight: 500;
      letter-spacing: 3px; text-transform: uppercase;
    }
    .status-line {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--green); font-size: 12px; letter-spacing: 2px;
      text-transform: uppercase; margin-bottom: 20px;
    }
    p.copy { color: var(--muted); font-size: 14px; line-height: 1.7; margin-bottom: 30px; }
    .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      font-family: 'IBM Plex Mono', monospace;
      padding: 12px 26px; border-radius: 4px;
      text-decoration: none; display: inline-block;
      font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    }
    .btn-primary { background: var(--gold); color: #12100d; border: 1px solid var(--gold); }
    .btn-primary:hover { background: var(--gold-hi); border-color: var(--gold-hi); }
    .btn-secondary { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
    .btn-secondary:hover { background: rgba(201, 168, 118, 0.1); }
  </style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 104 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M4 48 L22 42 M22 42 L98 42 M22 42 L22 4" stroke="#c9a876" stroke-width="1" stroke-dasharray="2 3"/>
      <path d="M4 26 L4 10 L18 10 M66 10 L80 10 L80 26 M80 32 L80 48 L66 48 M18 48 L4 48 L4 32" stroke="#ece5d8" stroke-width="2.4"/>
      <path d="M4 10 L22 4 L98 4 L98 42 L80 48 M80 10 L98 4" stroke="#c9a876" stroke-width="1.8"/>
      <circle cx="80" cy="10" r="3.4" fill="#d94f3d"/>
    </svg>
    <span class="word">Frame &rarr; Form</span>
  </div>
  <div class="success-container">
    <div class="tick">&#10003;</div>
    <h1>You're in</h1>
    <div class="status-line">Subscription active</div>
    <p class="copy">Your payment went through and your subscription is live. The full pipeline is yours &mdash; generate, select, convert, and drop production-ready models straight into your scenes.</p>
    <div class="buttons">
      <a href="/app" class="btn btn-primary">Go to app</a>
      <a href="/account" class="btn btn-secondary">Account</a>
    </div>
  </div>
</body>
</html>
